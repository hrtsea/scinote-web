version: '2'

# 公共功能开关：web 与 delayed_job 共享，差异项（SCINOTE_SCHEDULER_ENABLED / WEB_SERVER_URL）在各服务内覆盖
x-common-env: &common-env
  RAILS_ENV: development
  # protocols.io 导入：需真实 API 令牌（留空则关闭）
  PROTOCOLS_IO_ACCESS_TOKEN: ""
  # AI 协议解析服务地址（同时需在 ApplicationSettings 中开启 ai_protocol_parser_enabled）
  AI_PROTOCOLS_PARSER: ""
  # ===== 以下功能开关为布尔型，设为 true 即开启 =====
  ENABLE_TEMPLATES_SYNC: "true"              # 模板项目同步
  ENABLE_FLUICS_SYNC: "true"                 # Fluics 标签模板同步
  ACTIVESTORAGE_ENABLE_PDF_PREVIEWS: "true"  # PDF 预览（需容器内已安装 poppler 等依赖）
  ACTIVESTORAGE_ENABLE_VIPS: "true"          # Active Storage vips 处理器
  CORE_API_V1_ENABLED: "true"                # Core API v1 路由门控
  CORE_API_V2_ENABLED: "true"                # Core API v2 路由门控
  CORE_API_KEY_ENABLED: "true"               # Core API Key 认证
  # PWA 跨域（CORS）：需填 PWA 站点的真实来源（留空则关闭）
  SCINOTE_PWA_DOMAIN_NAME: "https://pwa.example.com"

services:
  db:
    container_name: scinote_db_development
    image: postgres:18
    volumes:
      - scinote_development_postgres:/var/lib/postgresql/18/docker
    environment:
      - "POSTGRES_USER=postgres"
      - "POSTGRES_PASSWORD=mysecretpassword"
      - PGDATA=/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile.build
    image: scinote_web_development
    container_name: scinote_web_development
    stdin_open: true
    tty: true
    user: scinote
    depends_on:
      db:
        condition: service_healthy
    ports:
      # 与生产环境（3000）区分：宿主机 3001 -> 容器内 3000
      - "3001:3000"
    command: >
      bash -c "rm -f /usr/src/app/tmp/pids/server.pid &&
               (bundle check || bundle install) &&
               bundle exec rails s -b 0.0.0.0"
    environment:
      <<: *common-env
      # 定时任务仅由 delayed_job 进程运行，避免 web 与 worker 重复触发
      SCINOTE_SCHEDULER_ENABLED: "false"
    volumes:
      - .:/usr/src/app
      - scinote_development_bundler:/usr/local/bundle/
      - scinote_development_storage:/usr/src/app/storage

  webpack:
    build:
      context: .
      dockerfile: Dockerfile.build
    image: scinote_web_development
    container_name: scinote_webpack_development
    stdin_open: true
    tty: true
    user: scinote
    command: >
      bash -c "git config --global --add safe.directory '*' &&
               git config --global http.sslVerify false &&
               git config --global url.\"https://ghproxy.net/https://github.com/\".insteadOf \"https://github.com/\" &&
               yarn install && yarn build --watch"
    environment:
      - NODE_ENV=development
      - npm_config_build_from_source=true
    volumes:
      - .:/usr/src/app
      - scinote_development_bundler:/usr/local/bundle/

  css_bundling:
    build:
      context: .
      dockerfile: Dockerfile.build
    image: scinote_web_development
    container_name: scinote_css_bundling_development
    stdin_open: true
    tty: true
    user: scinote
    command: >
      bash -c "until [ -f node_modules/.yarn-state.yml ]; do echo 'waiting for yarn install (webpack)...'; sleep 3; done; yarn build:css --watch"
    environment:
      - NODE_ENV=development
    volumes:
      - .:/usr/src/app
      - scinote_development_bundler:/usr/local/bundle/

  tailwind:
    build:
      context: .
      dockerfile: Dockerfile.build
    image: scinote_web_development
    container_name: scinote_tailwind_development
    stdin_open: true
    tty: true
    user: scinote
    command: >
      bash -c "rails tailwindcss:watch"
    environment:
      - RAILS_ENV=development
      - NODE_ENV=development
    volumes:
      - .:/usr/src/app
      - scinote_development_bundler:/usr/local/bundle/

  delayed_job:
    build:
      context: .
      dockerfile: Dockerfile.build
    image: scinote_web_development
    container_name: scinote_delayed_job_development
    stdin_open: true
    tty: true
    user: scinote
    depends_on:
      db:
        condition: service_healthy
    command: >
      bash -c "rm -f /usr/src/app/tmp/pids/delayed_job.pid &&
               (bundle check || bundle install) &&
               bundle exec rake jobs:work"
    environment:
      <<: *common-env
      # PDF 生成所需：worker 内 Chromium 用此 URL 拉取 CSS/图片；否则报 pdf_error
      WEB_SERVER_URL: "http://web:3000"
      # 定时任务（提醒/同步/清理）仅由本 worker 进程运行
      SCINOTE_SCHEDULER_ENABLED: "true"
    volumes:
      - .:/usr/src/app
      - scinote_development_bundler:/usr/local/bundle/
      - scinote_development_storage:/usr/src/app/storage

networks:
  default:
    # 独立于生产环境的默认网络（生产使用 scinote-web_default），避免 db 服务名 DNS 冲突
    name: scinote_development_network

volumes:
  # 复用旧 project 名下的数据卷（已装好的 gems / 已迁移的开发库 / 附件），
  # 配合 -p scinote_dev 独立 project 启动，与生产环境彻底隔离
  scinote_development_postgres:
    external: true
    name: scinote-web_scinote_development_postgres
  scinote_development_bundler:
    external: true
    name: scinote-web_scinote_development_bundler
  scinote_development_storage:
    external: true
    name: scinote-web_scinote_development_storage
