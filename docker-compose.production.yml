version: '2'
services:
  db:
    container_name: scinote_db_production
    image: postgres:18
    volumes:
      - scinote_production_postgres:/var/lib/postgresql/18/docker
    environment:
      - "POSTGRES_USER=postgres"
      - "POSTGRES_PASSWORD=mysecretpassword"
      - PGDATA=/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile.production
    image: scinote_web_production
    container_name: scinote_web_production
    stdin_open: true
    env_file: ./production.env
    tty: true
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    command: bash -c "rm -f /usr/src/app/tmp/pids/server.pid && rails s -b 0.0.0.0"
    environment:
      - RAILS_ENV=production
      # 定时任务仅由 jobs 进程运行，避免与 jobs 重复触发
      - SCINOTE_SCHEDULER_ENABLED=false
    volumes:
      - scinote_production_storage:/usr/src/app/storage

  jobs:
    image: scinote_web_production
    container_name: scinote_jobs_production
    tty: true
    depends_on:
      db:
        condition: service_healthy
    command: rake jobs:work
    env_file: ./production.env
    environment:
      - RAILS_ENV=production
      # PDF 生成：worker 内 Chromium 需访问 web 容器内部地址，不能用自己的 localhost（与 dev compose 一致）
      - WEB_SERVER_URL=http://web:3000
    volumes:
      - scinote_production_storage:/usr/src/app/storage

volumes:
  scinote_production_postgres:
  scinote_production_storage:
