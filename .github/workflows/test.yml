name: Test

on:
  push:
    branches: [develop, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:dind
        options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Fix ownership
        run: sudo chown --recursive 1000 .

      - name: Build test image
        run: make docker-ci

      - name: Run tests
        run: make tests-ci
